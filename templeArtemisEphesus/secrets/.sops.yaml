# Recipient must be the AGE-CONVERTED (ssh-to-age) form of the host SSH key,
# NOT the raw "ssh-ed25519 AAAA..." key. sops >= 3.12 encrypts natively to
# SSH keys (age stanza type "ssh-ed25519"), which sops-nix's
# sops-install-secrets cannot decrypt: it only loads SSH host keys as
# converted X25519 age identities. To migrate an existing file, run as root:
#   sudo env SOPS_AGE_SSH_PRIVATE_KEY_FILE=/etc/ssh/ssh_host_ed25519_key \
#     sops updatekeys secrets.yaml
keys:
  - &wranHearst age1r3awak57mnkd0evxhhpjvstwz3asqsw6gukf0g87t6psmq67uq5s7n7css
creation_rules:
  - path_regex: secrets\.yaml
    key_groups:
      - age:
        - *wranHearst
