# Fix Shift+Enter (and other modified keys) within `pi` when it runs inside
# tmux under a Kitty-protocol terminal such as kitty.
#
# `extended-keys on` makes tmux request extended key reporting from the outer
# terminal and pass the resulting sequences through to the application, and
# `extended-keys-format csi-u` makes tmux emit them in the CSI-u form that pi
# understands.  On its own this is *not* enough for kitty:
#
#   * tmux's extended-keys request is xterm's modifyOtherKeys
#     (`CSI > 4 ; 2 m`, the `Eneks` capability supplied by tmux's `extkeys`
#     terminal feature).
#   * kitty deliberately does not implement modifyOtherKeys -- its
#     `screen_modify_other_keys` handler only logs an error and changes
#     nothing.  kitty keeps sending a bare CR for Shift+Enter, which tmux
#     passes through and pi treats as "submit".
#
# kitty *does* implement its own keyboard protocol, and tmux already knows how
# to parse kitty CSI-u key sequences coming from the outer terminal
# (`tty_keys_extended_key` handles both `CSI 27 ; m ; k ~` and `CSI k ; m u`).
# So for kitty ask for the kitty protocol instead of modifyOtherKeys by
# overriding the enable/disable capabilities:
#
#   * Eneks = `CSI > 1 u` pushes keyboard-protocol flags 1
#     ("disambiguate escape codes"), which makes kitty report Shift+Enter as
#     `CSI 13 ; 2 u`.
#   * Dseks = `CSI < u` pops those flags again when tmux disables them.
set -g extended-keys on
set -g extended-keys-format csi-u
set -as terminal-features 'xterm-kitty:extkeys'
set -as terminal-overrides 'xterm-kitty:Eneks=\E[>1u'
set -as terminal-overrides 'xterm-kitty:Dseks=\E[<u'


#used by the nixvim tmux plugin
set -g allow-passthrough on
