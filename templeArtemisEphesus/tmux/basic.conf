# Extended key handling for `pi` (and other TUI apps) inside tmux.
#
# `extended-keys on` makes tmux honour an application's request for extended
# key reporting.  pi asks for xterm's modifyOtherKeys mode 2
# (`CSI > 4 ; 2 m`) when it starts inside tmux, and tmux then re-encodes
# modified keys for the pane.  `extended-keys-format csi-u` makes tmux emit
# those keys in the CSI-u form that pi understands.
#
# Do *not* override the `Eneks`/`Dseks` capabilities to make tmux speak
# kitty's keyboard protocol here, and do *not* advertise `extkeys` for
# xterm-kitty.  tmux 3.7c's input parser (`tty_keys_extended_key`) only
# understands two forms:
#
#   * `CSI <num> ; <mod> u`
#   * `CSI 27 ; <mod> ; <num> ~`
#
# Kitty's "disambiguate escape codes" mode (pushed by an `Eneks` override, or
# requested through `terminal-features 'xterm-kitty:extkeys'` + an `Eneks`
# override) additionally emits modifier-less CSI-u sequences such as
# `CSI 27 u` (Escape), `CSI <num> u` for the keypad / Menu / PrintScreen /
# Pause keys, and `CSI P` / `CSI Q` / `CSI S` for F1 / F2 / F4.  tmux cannot
# parse any of those, so it falls back to passing them through as literal
# text and pi inserts the raw control sequence into its editor.  Letting the
# outer terminal stay in its legacy mode avoids all of these malformed
# sequences while still giving pi the modified keys it needs through tmux's
# own extended-key support.
#
# The one key kitty cannot report in legacy mode is Shift+Enter, because
# kitty ignores xterm's modifyOtherKeys request.  That is handled on the
# kitty side (see templeArtemisEphesus/kitty/conf.nix, which maps
# shift+enter to the CSI-u sequence `CSI 13 ; 2 u`); tmux and pi already
# understand it, so the newline behaviour is preserved.  Terminals that do
# implement modifyOtherKeys (Ghostty, WezTerm, iTerm2, ...) need no mapping.
set -g extended-keys on
set -g extended-keys-format csi-u


#used by the nixvim tmux plugin
set -g allow-passthrough on

# Open the pane's scrollback in neovim in a new tmux window (copy-mode
# replacement): captures from the top of history (`-S -`; capped by
# `history-limit 2000` in inheritedConf.conf) into a read-only nvim, and
# nvim exits (closing the window) on `:q`.  Yank text back into tmux from
# there with
#   :'<,'>w !tmux load-buffer -
# then paste with prefix + ].
#
# The capture uses `-e` so that escape sequences (colours and other
# attributes) are captured along with the text; capture is a snapshot of
# the pane's rendered layout, so the visual formatting is preserved too.
# The inline nvim commands set up a conceal-only syntax that hides those
# raw `ESC[...m` sequences, so the window shows clean text like the
# original pane did instead of literal escape codes.
#
# The command is wrapped in `run-shell -b` because a bare `new-window`
# would run its shell command inside the new window, where the implicit
# capture target would be the new (empty) pane rather than the pane the
# key was pressed in.  `run-shell` expands `#{pane_id}` in the context of
# the pane that invoked the binding, so the inner capture is explicitly
# targeted at that pane.  `-b` runs it in the background; `new-window`
# then switches to the new window, and `:q` in nvim closes it.
#
# Bound with the prefix in tmux's default table as `{` (i.e. prefix then
# Shift+{).  Note that tmux's config syntax for that combination is
# `{`, not `C-{`, and that the key *must* be quoted: the config parser
# treats a bare `{` as the start of a brace command group (as used by
# `if-shell` blocks), which is a syntax error here.
bind-key "{" run-shell -b "tmux new-window -n scrollback \"tmux capture-pane -e -p -S - -t '#{pane_id}' | nvim -R - -c 'syn match ansiEsc /\\%x1b\\[[0-9;]*[a-zA-Z]/ conceal' -c 'set conceallevel=2'\""
